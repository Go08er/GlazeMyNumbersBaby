[package]
name = "gmnb"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
# Floor: GTK 4.18 / libadwaita 1.7 (Debian 13, Fedora 42+, Arch).
gtk = { package = "gtk4", version = "0.11", features = ["v4_18"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_7"] }
pangocairo = "0.22"
calcvm.workspace = true
pango = { version = "0.22", features = ["v1_56"] }
datecalc.workspace = true
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unitconv.workspace = true
graphing.workspace = true
appcore.workspace = true
