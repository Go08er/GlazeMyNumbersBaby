name: Packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Least privilege: build jobs only read; the release job alone may write.
permissions:
  contents: read

jobs:
  flatpak:
    name: Flatpak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Let bubblewrap create user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install flatpak
        # librsvg2-common: gdk-pixbuf's SVG loader, which flatpak uses to
        # validate the exported (SVG) app icon.
        run: sudo apt-get update && sudo apt-get install -y flatpak librsvg2-common
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Build bundles (nix run .#flatpak, .#flatpak-dgmnb)
        run: |
          nix run .#flatpak -- --keep-cache
          nix run .#flatpak-dgmnb
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flatpak
          path: |
            dist/GMNB.flatpak
            dist/DGMNB.flatpak

  arch:
    name: Arch Linux
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Toolchain and dependencies
        run: pacman -Syu --noconfirm --needed base-devel git rust gtk4 libadwaita wayland libxkbcommon
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: makepkg
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ver=$(sed -n 's/^pkgver=//p' packaging/arch/PKGBUILD)
          useradd -m builder
          mkdir -p /home/builder/pkg
          cp packaging/arch/PKGBUILD /home/builder/pkg/
          # Same layout as the GitHub tag tarball the PKGBUILD downloads.
          git archive --prefix="GlazeMyNumbersBaby-$ver/" -o "/home/builder/pkg/gmnb-$ver.tar.gz" HEAD
          chown -R builder /home/builder/pkg
          cd /home/builder/pkg
          runuser -u builder -- makepkg --printsrcinfo > .SRCINFO
          # CI builds the checked-out tree, not the release tarball, so the
          # PKGBUILD's pinned checksum can't match; skip it here only.
          runuser -u builder -- makepkg -f --noconfirm --skipchecksums
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp ./*.pkg.tar.zst "$GITHUB_WORKSPACE/out/"
          cp .SRCINFO "$GITHUB_WORKSPACE/out/gmnb.SRCINFO"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arch
          path: out/*

  debian:
    name: Debian 13
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl build-essential \
            debhelper devscripts pkgconf libgtk-4-dev libadwaita-1-dev libpango1.0-dev libglib2.0-dev \
            libwayland-dev
      - name: Rust (rustup; Debian 13's rustc is too old)
        run: curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: dpkg-buildpackage
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cp -r packaging/debian debian
          dpkg-buildpackage -b -us -uc
          mkdir -p out
          cp ../*.deb out/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: debian
          path: out/*.deb

  fedora:
    name: Fedora
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Build dependencies
        run: |
          dnf install -y git rpm-build rpmdevtools cargo rust gcc gtk4-devel libadwaita-devel \
            pango-devel wayland-devel desktop-file-utils libappstream-glib
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: rpmbuild
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          rpmdev-setuptree
          ver=$(rpmspec -q --qf '%{version}\n' packaging/fedora/gmnb.spec | head -1)
          git archive --prefix="GlazeMyNumbersBaby-$ver/" -o ~/rpmbuild/SOURCES/"GlazeMyNumbersBaby-$ver.tar.gz" HEAD
          rpmbuild -bb packaging/fedora/gmnb.spec
          mkdir -p out
          cp ~/rpmbuild/RPMS/*/*.rpm out/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fedora
          path: out/*.rpm

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [flatpak, arch, debian, fedora]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One publisher per tag at a time; a second run waits instead of
    # interleaving with (or cancelling) the first.
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          (cd artifacts && sha256sum -- * > ../SHA256SUMS)
          cat SHA256SUMS
          # The tag must still name the commit these packages were built
          # from (annotated tags are peeled); checked before anything is
          # created or uploaded, and again right before publishing.
          tag_commit() {
            local kind sha hops=0
            read -r kind sha < <(gh api "repos/$REPO/git/ref/tags/$TAG" -q '"\(.object.type) \(.object.sha)"') || true
            while [ "${kind:-}" = tag ] && [ "$hops" -lt 5 ]; do
              read -r kind sha < <(gh api "repos/$REPO/git/tags/$sha" -q '"\(.object.type) \(.object.sha)"') || true
              hops=$((hops + 1))
            done
            [ "${kind:-}" = commit ] && echo "$sha"
          }
          same_source() {
            local now
            now=$(tag_commit || true)
            if [ "$now" != "$GITHUB_SHA" ]; then
              echo "::error::$TAG points at ${now:-nothing readable}, but these packages were built from $GITHUB_SHA. Not publishing."
              exit 1
            fi
          }
          same_source
          # Does the release exist? "Not found" is the only failure that
          # means no; anything else stops the job.
          if out=$(gh release view "$TAG" --repo "$REPO" --json tagName 2>&1); then
            existed=true
          elif grep -qi "release not found" <<<"$out"; then
            existed=false
          else
            echo "::error::Couldn't look up release $TAG: $out"
            exit 1
          fi
          # Name, upload state, size and digest of every asset.
          listing() {
            gh release view "$TAG" --repo "$REPO" --json assets \
              -q '.assets[] | [.name, .state, (.size | tostring), (.digest // "")] | @tsv'
          }
          # check FILE: 0 if the release has it complete and byte for byte,
          # 1 if it hasn't got it, 2 if what it has is unfinished or differs,
          # 3 if it couldn't be checked. (Without a digest from the API, the
          # asset is downloaded and hashed.)
          check() {
            local name line state size digest sum got
            name=$(basename "$1")
            line=$(awk -F'\t' -v n="$name" '$1 == n' <<<"$assets")
            [ -n "$line" ] || return 1
            IFS=$'\t' read -r _ state size digest <<<"$line"
            [ "$state" = uploaded ] && [ "$size" = "$(stat -c %s "$1")" ] || return 2
            sum=$(sha256sum "$1" | cut -d' ' -f1)
            if [ -n "$digest" ]; then
              [ "$digest" = "sha256:$sum" ] || return 2
            else
              rm -rf fetched && mkdir fetched
              gh release download "$TAG" --repo "$REPO" -p "$name" -D fetched || return 3
              got=$(sha256sum "fetched/$name" | cut -d' ' -f1)
              [ "$got" = "$sum" ] || return 2
            fi
          }
          if [ "$existed" = false ]; then
            # Start as a draft holding just the manifest, so whatever state
            # an interruption leaves says which build it belongs to; it's
            # published only once every file is there and complete.
            gh release create "$TAG" SHA256SUMS --draft --verify-tag \
              --repo "$REPO" \
              --title "GMNB & DGMNB $TAG" \
              --notes "Built from commit $GITHUB_SHA; see SHA256SUMS." \
              --generate-notes
          else
            # A re-run, or a draft an earlier run left behind. Only added to
            # if what's there came from this exact build.
            assets=$(listing)
            rc=0
            check SHA256SUMS || rc=$?
            mkdir published
            if [ "$rc" = 0 ]; then
              if gh release download "$TAG" --repo "$REPO" -p SHA256SUMS -D published; then
                cmp -s published/SHA256SUMS SHA256SUMS || rc=2
              else
                rc=3
              fi
            fi
            if [ "$rc" = 3 ]; then
              echo "::error::Couldn't download SHA256SUMS from $TAG to check it; nothing was changed. Run the job again."
              exit 1
            fi
            if [ "$rc" != 0 ]; then
              echo "::error::$TAG has no complete SHA256SUMS from this build; delete the release by hand before publishing again."
              [ -f published/SHA256SUMS ] && { diff published/SHA256SUMS SHA256SUMS || true; }
              exit 1
            fi
          fi
          draft=$(gh release view "$TAG" --repo "$REPO" --json isDraft -q .isDraft)
          assets=$(listing)
          # Look at everything before changing anything: a published release
          # with a bad file is left exactly as it is.
          declare -A found
          for f in artifacts/*; do
            rc=0
            check "$f" || rc=$?
            found[$f]=$rc
            if [ "$rc" = 3 ]; then
              echo "::error::Couldn't download $(basename "$f") from $TAG to check it; nothing was changed. Run the job again."
              exit 1
            fi
            if [ "$rc" = 2 ] && [ "$draft" != true ]; then
              echo "::error::$(basename "$f") on the published $TAG is unfinished or differs from this build; fix it by hand."
              exit 1
            fi
          done
          for f in artifacts/*; do
            name=$(basename "$f")
            case ${found[$f]} in
              0) echo "already there: $name" ;;
              1) gh release upload "$TAG" "$f" --repo "$REPO" ;;
              *)
                # An unfinished upload in a release nobody can see yet.
                echo "redoing an unfinished upload: $name"
                gh release delete-asset "$TAG" "$name" --repo "$REPO" --yes
                gh release upload "$TAG" "$f" --repo "$REPO"
                ;;
            esac
          done
          # Every file must be there and complete before the release goes
          # public.
          assets=$(listing)
          bad=0
          for f in SHA256SUMS artifacts/*; do
            rc=0
            check "$f" || rc=$?
            if [ "$rc" = 3 ]; then
              echo "::error::Couldn't download $(basename "$f") from $TAG to verify it; the release stays unpublished. Run the job again."
              bad=1
            elif [ "$rc" != 0 ]; then
              echo "::error::$(basename "$f") is missing or incomplete on $TAG"
              bad=1
            fi
          done
          [ "$bad" = 0 ] || exit 1
          if [ "$draft" = true ]; then
            same_source
            gh release edit "$TAG" --repo "$REPO" --draft=false
          fi
          state=$(gh release view "$TAG" --repo "$REPO" --json isDraft,tagName -q '"\(.tagName) \(.isDraft)"')
          if [ "$state" != "$TAG false" ]; then
            echo "::error::$TAG didn't end up published ($state)."
            exit 1
          fi
          echo "$TAG is published with every file, built from $GITHUB_SHA."
