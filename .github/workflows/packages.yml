name: Packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Least privilege: build jobs only read; the release job alone may write.
permissions:
  contents: read

jobs:
  flatpak:
    name: Flatpak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Let bubblewrap create user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install flatpak
        # librsvg2-common: gdk-pixbuf's SVG loader, which flatpak uses to
        # validate the exported (SVG) app icon.
        run: sudo apt-get update && sudo apt-get install -y flatpak librsvg2-common
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Build bundles (nix run .#flatpak, .#flatpak-dgmnb)
        run: |
          nix run .#flatpak -- --keep-cache
          nix run .#flatpak-dgmnb
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flatpak
          path: |
            dist/GMNB.flatpak
            dist/DGMNB.flatpak

  arch:
    name: Arch Linux
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Toolchain and dependencies
        run: pacman -Syu --noconfirm --needed base-devel git rust gtk4 libadwaita wayland libxkbcommon
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: makepkg
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ver=$(sed -n 's/^pkgver=//p' packaging/arch/PKGBUILD)
          useradd -m builder
          mkdir -p /home/builder/pkg
          cp packaging/arch/PKGBUILD /home/builder/pkg/
          # Same layout as the GitHub tag tarball the PKGBUILD downloads.
          git archive --prefix="GlazeMyNumbersBaby-$ver/" -o "/home/builder/pkg/gmnb-$ver.tar.gz" HEAD
          chown -R builder /home/builder/pkg
          cd /home/builder/pkg
          runuser -u builder -- makepkg --printsrcinfo > .SRCINFO
          # CI builds the checked-out tree, not the release tarball, so the
          # PKGBUILD's pinned checksum can't match; skip it here only.
          runuser -u builder -- makepkg -f --noconfirm --skipchecksums
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp ./*.pkg.tar.zst "$GITHUB_WORKSPACE/out/"
          cp .SRCINFO "$GITHUB_WORKSPACE/out/gmnb.SRCINFO"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arch
          path: out/*

  debian:
    name: Debian 13
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl build-essential \
            debhelper devscripts pkgconf libgtk-4-dev libadwaita-1-dev libpango1.0-dev libglib2.0-dev \
            libwayland-dev
      - name: Rust (rustup; Debian 13's rustc is too old)
        run: curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: dpkg-buildpackage
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cp -r packaging/debian debian
          dpkg-buildpackage -b -us -uc
          mkdir -p out
          cp ../*.deb out/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: debian
          path: out/*.deb

  fedora:
    name: Fedora
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Build dependencies
        run: |
          dnf install -y git rpm-build rpmdevtools cargo rust gcc gtk4-devel libadwaita-devel \
            pango-devel wayland-devel desktop-file-utils libappstream-glib
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: rpmbuild
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          rpmdev-setuptree
          ver=$(rpmspec -q --qf '%{version}\n' packaging/fedora/gmnb.spec | head -1)
          git archive --prefix="GlazeMyNumbersBaby-$ver/" -o ~/rpmbuild/SOURCES/GlazeMyNumbersBaby-$ver.tar.gz HEAD
          rpmbuild -bb packaging/fedora/gmnb.spec
          mkdir -p out
          cp ~/rpmbuild/RPMS/*/*.rpm out/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fedora
          path: out/*.rpm

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [flatpak, arch, debian, fedora]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la artifacts
          # Re-runs refresh the assets of an existing release instead of failing.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" artifacts/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "GMNB & DGMNB $GITHUB_REF_NAME" \
              --generate-notes
          fi
