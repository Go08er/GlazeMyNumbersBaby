name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests, Nix build, flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Test suite (incl. golden tests against the C++ engine)
        run: nix develop -c cargo test --workspace --locked
      - name: Clippy
        run: nix develop -c cargo clippy --workspace --locked
      - name: Nix packages
        run: nix build -L .#gmnb .#dgmnb
      - name: Flake check
        run: nix flake check
