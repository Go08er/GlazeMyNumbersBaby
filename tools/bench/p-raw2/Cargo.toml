[package]
name = "p-raw2"
version = "0.1.0"
edition = "2024"
[dependencies]
winit = { version = "0.30", default-features = false, features = ["rwh_06", "wayland", "wayland-dlopen", "wayland-csd-adwaita"] }
softbuffer = { version = "0.4", default-features = false, features = ["wayland", "wayland-dlopen"] }
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd", "png-format"] }
fontdue = "0.9"
accesskit = { version = "0.25", optional = true }
accesskit_winit = { version = "0.34", default-features = false, features = ["accesskit_unix", "async-io", "rwh_06"], optional = true }
smithay-clipboard = { version = "0.7", optional = true }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"], optional = true }
[features]
a11y = ["dep:accesskit", "dep:accesskit_winit"]
clip = ["dep:smithay-clipboard"]
portal = ["dep:zbus"]
