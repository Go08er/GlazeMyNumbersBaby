[workspace]
resolver = "3"
members = [
    "crates/ratpack",
    "crates/calcmanager",
    "crates/unitconv",
    "crates/datecalc",
    "crates/copypaste",
    "crates/graphing",
    "crates/calcvm",
    "crates/appcore",
    "apps/gmnb",
    "apps/dgmnb",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
rust-version = "1.92"
authors = ["Microsoft Corporation (original Windows Calculator)", "GMNB contributors (Rust port)"]
repository = "https://github.com/Go08er/GlazeMyNumbersBaby"

[workspace.dependencies]
ratpack = { path = "crates/ratpack" }
calcmanager = { path = "crates/calcmanager" }
unitconv = { path = "crates/unitconv" }
datecalc = { path = "crates/datecalc" }
copypaste = { path = "crates/copypaste" }
graphing = { path = "crates/graphing" }
calcvm = { path = "crates/calcvm" }
appcore = { path = "crates/appcore" }

# Arbitrary-precision math is painfully slow unoptimised; keep tests usable.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# Arbitrary-precision maths: keep debug builds and tests responsive.
[profile.dev.package.ratpack]
opt-level = 3

[profile.dev.package.calcmanager]
opt-level = 3

[profile.dev.package.graphing]
opt-level = 3

[profile.release]
lto = "thin"
strip = true


# DGMNB's release profile: smallest code (its own pages are most of its
# memory, having no big shared libraries), with the number crunchers kept at
# full speed.
[profile.lean]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.lean.package.ratpack]
opt-level = 3

[profile.lean.package.calcmanager]
opt-level = 3

[profile.lean.package.graphing]
opt-level = 3
