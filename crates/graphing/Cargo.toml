[package]
name = "graphing"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
# Correctly rounded binary64 elementary functions (CORE-MATH, MIT), vendored
# in crates/crmath and built for baseline x86-64 and x86-64-v3, picked at
# run time: every evaluation's primitives and the interval core's.
core-math = { package = "crmath", path = "../crmath" }
# E-graph equality saturation (MIT): the simplifier's rewriting
# (`simplify::egraph`), with every rule checked against MPFR in tests.
egg = { version = "0.11", default-features = false }
# Development only (`--features mpfr-oracle`): MPFR, to check the interval
# core's enclosures against 256-bit values. LGPL; never in a release build.
rug = { version = "1.28", default-features = false, features = ["float", "std"], optional = true }
gmp-mpfr-sys = { version = "1.6", default-features = false, features = ["mpfr", "use-system-libs"], optional = true }
# Machine-readable certificates of the analysis' proofs (`certify`).
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"

[features]
mpfr-oracle = ["dep:rug", "dep:gmp-mpfr-sys"]
