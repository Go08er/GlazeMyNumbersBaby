[package]
name = "gmnb-theme"
description = "GMNB's theme scripts: a sandboxed, bounded Luau VM and the value tree it hands the host"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
# The base colours and measurements (DGMNB's), and the colour maths.
appcore.workspace = true
# The app's own picture decoders, the animation player's timelines and
# the field pass (docs/theming-media.md). No toolkit there either.
gmnb-media.workspace = true
# What a theme's sounds are made of: recipes, the table of sounds by event
# (the engine itself is the app's to start).
gmnb-sound.workspace = true
# Luau only (its C++ is built by `cc`; mlua has no default features). No
# `send` (GMNB's themes live on the main thread), no `async`, no JIT.
mlua = { version = "0.12.2", default-features = false, features = ["luau"] }
# The processor time a call has had (clock_gettime): what its time limit
# measures.
libc = "0.2"
