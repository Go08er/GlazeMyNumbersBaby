<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#1b1145"/>
      <stop offset="1" stop-color="#0a0720"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1a63"/>
      <stop offset="1" stop-color="#120b33"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <clipPath id="tile">
      <rect x="8" y="6" width="112" height="110" rx="26"/>
    </clipPath>
    <linearGradient id="glass" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.07"/>
    </linearGradient>
    <linearGradient id="key" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7ad9"/>
      <stop offset="1" stop-color="#8a63ff"/>
    </linearGradient>
    <linearGradient id="digits" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.2" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d4c2ff"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- tile with a little thickness, GNOME style -->
  <rect x="8" y="10" width="112" height="110" rx="26" fill="url(#edge)"/>
  <rect x="8" y="6" width="112" height="110" rx="26" fill="url(#base)"/>

  <!-- aurora ribbons -->
  <g clip-path="url(#tile)">
    <g filter="url(#soft)" opacity="0.95">
      <ellipse cx="26" cy="22" rx="40" ry="26" fill="#7c4dff"/>
      <ellipse cx="104" cy="44" rx="30" ry="34" fill="#ff4fb0" opacity="0.8"/>
      <ellipse cx="40" cy="112" rx="48" ry="26" fill="#19d3c5" opacity="0.85"/>
      <ellipse cx="108" cy="112" rx="26" ry="20" fill="#3d6bff" opacity="0.9"/>
    </g>
    <rect x="8" y="6" width="112" height="110" fill="url(#sheen)"/>
  </g>
  <rect x="8.5" y="6.5" width="111" height="109" rx="25.5" fill="none" stroke="#ffffff" stroke-opacity="0.22"/>

  <!-- floating glass slab -->
  <rect x="26" y="26" width="76" height="82" rx="16" fill="#000000" opacity="0.35" filter="url(#shadow)"/>
  <rect x="24" y="20" width="80" height="84" rx="16" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.38"/>

  <!-- display -->
  <text x="94" y="45" text-anchor="end" font-family="Outfit, sans-serif" font-size="21" font-weight="300" fill="#b79bff" opacity="0.7" filter="url(#glow)">42</text>
  <text x="94" y="45" text-anchor="end" font-family="Outfit, sans-serif" font-size="21" font-weight="300" fill="url(#digits)">42</text>
  <rect x="33" y="52" width="62" height="1" fill="#ffffff" opacity="0.18"/>

  <!-- keys -->
  <g fill="url(#key)" stroke="#ffffff" stroke-opacity="0.25" stroke-width="0.8">
    <rect x="33" y="59" width="17" height="13" rx="4.5"/>
    <rect x="55" y="59" width="17" height="13" rx="4.5"/>
    <rect x="33" y="77" width="17" height="13" rx="4.5"/>
    <rect x="55" y="77" width="17" height="13" rx="4.5"/>
  </g>
  <rect x="77" y="59" width="18" height="31" rx="5.5" fill="url(#hot)" opacity="0.6" filter="url(#glow)"/>
  <rect x="77" y="59" width="18" height="31" rx="5.5" fill="url(#hot)"/>
  <g stroke="#ffffff" stroke-width="2.4" stroke-linecap="round">
    <line x1="81.5" y1="71" x2="90.5" y2="71"/>
    <line x1="81.5" y1="78" x2="90.5" y2="78"/>
  </g>
</svg>
